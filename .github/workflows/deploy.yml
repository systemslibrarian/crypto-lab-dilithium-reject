name: Deploy

# One workflow, one gate. This lab used to split them: ci.yml ran lint, the
# prettier check, the build and Vitest on pull_request and owned the Dependabot
# auto-merge, while this file ran the Playwright axe gate on push to main. A
# bump never had to clear the browser gate to merge itself, so the deploy could
# fail on main with nothing red on the PR. Now the `deploy` job runs every check
# either file ran, on pull requests too, and `dependabot-auto-merge` needs it.
# ci.yml is gone -- a second copy of a gate is how the two drift apart.
#
# This lab used to publish with peaceiris/actions-gh-pages, pushing dist/ to a
# gh-pages branch, and that is why its live site served a build from 2026-07-11
# for nearly three months while every check was green. The repository's Pages
# source is `build_type: workflow`, which serves ONLY what an actions/deploy-pages
# step uploads -- so each run updated the gh-pages branch and nothing served it.
# The branch even carried the fix the live CSS was missing. It published into a
# branch no one reads.
#
# Two checkers were blind to it for the same reason: deploy-sync keeps a lab only
# if a workflow mentions `deploy-pages`, and gate-sync learned peaceiris in
# 2026-09-10 but judges the gate, not whether the publish reaches the site.
#
# So this now publishes the way 193 labs in the fleet do: `build` uploads a Pages
# artifact, `deploy` consumes it. Both jobs are visible to every checker, and the
# shape is the one audits/_MASTER-TEMPLATE.md 6.1-6.2 specifies.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format
      - name: Unit tests (incl. simulation calibration + axe a11y)
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
  # trigger the post-auto-merge deploy depends on: the dispatched run would
  # build, pass the gate, and skip the publish, so the site would still never
  # update.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human. `build` is the gate the
  # `deploy` job above also depends on, so they cannot be different gates.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
